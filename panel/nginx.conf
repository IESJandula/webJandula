server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hasta octubre de 2026 el backend vivia en noticias.iesjandula.es, y las
    # imagenes subidas desde el panel se guardaron en la base de datos con ese
    # dominio delante. Ahora noticias.iesjandula.es es el panel: sus /uploads/
    # se le piden al backend dentro de la red del compose para que esas
    # imagenes no se rompan. El resolver y la variable hacen que nginx arranque
    # aunque el backend todavia no este en pie.
    location /uploads/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend http://backend:3001;
        proxy_pass $backend;
        proxy_set_header Host $host;
        expires 30d;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
