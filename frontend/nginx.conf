# Mapa de las URLs del Drupal antiguo (usaba ?q=... como ruta) a la pagina
# equivalente de la web nueva. Sin esto, Google tarda meses en trasladar la
# autoridad del sitio viejo, porque un 404 no transfiere nada y un 301 si.
# Para anadir mas: mira en Search Console -> Paginas -> "No encontrada (404)".
map $arg_q $destino_drupal {
    default                 https://iesjandula.es/;
    "node/630"              https://iesjandula.es/secretaria_virtual/;   # Admision en ESO y Bachillerato
    "taxonomy/term/5"       https://iesjandula.es/proyectos/;            # Planes y Proyectos
    "taxonomy/term/47"      https://iesjandula.es/oferta/;               # Ciclos Formativos
    "taxonomy/term/52"      https://iesjandula.es/oferta/;               # TECO
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Traefik termina el TLS y habla http con este contenedor. Sin esto, nginx
    # firma sus redirecciones internas (p.ej. /oferta -> /oferta/) como http://
    # y el navegador da un salto de mas por el 308 de Traefik.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Una noticia publicada despues del ultimo build no tiene pagina propia
    # (se generan durante el build). En vez de un 404, se atiende con
    # /noticias/ver, que pide la noticia a la API y se rellena en el navegador.
    location ^~ /noticias/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /noticias/ver/index.html;
    }

    # La web antigua (Drupal) colgaba de /drupal/ en este mismo dominio y sigue
    # indexada en Google. Se manda cada URL a su equivalente actual.
    location ^~ /drupal {
        add_header Cache-Control "no-store" always;
        return 301 $destino_drupal;
    }

    # El HTML se revalida siempre: el sitio es estatico y se reconstruye al
    # publicar una noticia, asi que una copia cacheada se queda obsoleta.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }
    # Los assets de Astro llevan hash en el nombre: cachear a tope es seguro.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}

# Dominio canonico: iesjandula.es (sin www). El www existe y sirve para que
# nadie se quede fuera, pero manda a los buscadores al canonico para no
# competir consigo mismo con contenido duplicado.
#
# El Cache-Control no-store es deliberado: un 301 sin el se queda pegado en el
# navegador para siempre. Eso es justo lo que paso con la redireccion anterior
# hacia el blog de Averroes. Google respeta el 301 igual a efectos de SEO.
server {
    listen 80;
    server_name www.iesjandula.es;

    add_header Cache-Control "no-store" always;
    return 301 https://iesjandula.es$request_uri;
}
