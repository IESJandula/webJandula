server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Una noticia publicada despues del ultimo build no tiene pagina propia
    # (se generan durante el build). En vez de un 404, se atiende con
    # /noticias/ver, que pide la noticia a la API y se rellena en el navegador.
    location ^~ /noticias/ {
        try_files $uri $uri/ /noticias/ver/index.html;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
